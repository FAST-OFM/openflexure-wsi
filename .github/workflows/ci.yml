name: Source validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - name: Install license checker
        run: python -m pip install --upgrade pip reuse==5.1.1
      - name: Verify file-level licensing
        run: reuse lint
      - name: Install Python package and test tools
        run: python -m pip install -e ".[dev]"
      - name: Check Python source
        run: python -m ruff check src tests
      - name: Verify GPL boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          forbidden = ("PolyForm-Noncommercial", "CC-BY-NC-SA")
          paths = [Path("src"), Path("tests"), Path("webapp")]
          findings = []
          for root in paths:
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text()
                  except (UnicodeDecodeError, OSError):
                      continue
                  if any(marker in text for marker in forbidden):
                      findings.append(str(path))
          if findings:
              raise SystemExit("Non-GPL license marker in combined work:\n" + "\n".join(findings))
          PY
      - name: Run backend tests
        run: python -m pytest -q tests/unit_tests tests/integration_tests
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Build UI for the simulated-server lifecycle test
        working-directory: webapp
        run: npm ci && npm run build
      - name: Start and stop the simulated server
        run: python tests/lifecycle_test/testfile.py

  webapp:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run lint:style
      - run: npm run test:unit
      - run: npm run build
